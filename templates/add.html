<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Recipe</title>
</head>
<body>
    <h1>Add New Recipe</h1>
    <form action="{{ url_for('add_recipe') }}" method="POST">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br>
        <label for="ingredients">Ingredients:</label><br>
        <textarea id="ingredients" name="ingredients" rows="4" cols="50" required></textarea><br>
        <label for="instructions">Instructions:</label><br>
        <textarea id="instructions" name="instructions" rows="4" cols="50" required></textarea><br>
        <label for="category">Category:</label>
        <select id="category" name="category">
            <option value="appetizers">Appetizers</option>
            <option value="mains">Main Dishes</option>
            <option value="desserts">Desserts</option>
            <option value="unknown">Unknown</option>
        </select><br>
        <input type="submit" value="Add Recipe">
    </form>
    <br>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>
